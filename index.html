<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookmax Community | Soft Blue</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/SDTGBKpD/image.png">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #f4f9ff;
            --card: #ffffff;
            --accent: #4a90e2;
            --light-accent: #e1efff;
            --text: #33475b;
            --gray: #9fb3c8;
            --radius: 28px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 90%;
            max-width: 1000px;
            background: var(--card);
            margin-top: 20px;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(74, 144, 226, 0.08);
            text-align: center;
        }

        .profile-area {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        #user-name {
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 40px 0;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(74, 144, 226, 0.12);
        }

        .photo {
            width: 100%;
            height: 380px;
            border-radius: 20px;
            object-fit: cover;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 5px;
        }

        .name {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .rating-badge {
            background: var(--light-accent);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background: #edf2f7;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: 1s ease;
        }

        .vote-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-vote {
            border: none;
            background: var(--light-accent);
            color: var(--accent);
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-vote:hover {
            background: var(--accent);
            color: white;
        }

        .comment-section {
            border-top: 1px solid #f0f4f8;
            padding-top: 15px;
        }

        .comment-list {
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .comment-item {
            margin-bottom: 8px;
            padding: 5px;
        }

        .comment-item b {
            color: var(--accent);
        }

        .hall {
            width: 95%;
            max-width: 1000px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-top: 20px;
        }

        .hall h2 {
            margin: 0 0 12px 0;
        }

        .hall-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .hall-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .hall-item:last-child {
            border-bottom: none;
        }

        .medal {
            font-weight: 700;
        }

        .profile-view {
            width: 95%;
            max-width: 1000px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-top: 20px;
            display: none;
        }

        .profile-hero {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .profile-hero img {
            max-width: 320px;
            border-radius: 18px;
            width: 100%;
            object-fit: cover;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-main-photo {
            width: 100%;
            max-width: 400px;
            height: 500px;
            object-fit: cover;
            border-radius: 24px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 8px 30px rgba(74, 144, 226, 0.15);
        }

        .modal-name {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text);
            margin: 0;
            text-align: center;
        }

        .modal-section {
            background: var(--light-accent);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }

        .modal-section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 12px 0;
        }

        .modal-section-content {
            color: var(--text);
            line-height: 1.6;
            margin: 0;
        }

        .music-section {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--light-accent);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }

        .music-icon {
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .music-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-icon-wrapper::before {
            content: '▶';
            position: absolute;
            font-size: 0.8rem;
            color: var(--accent);
            opacity: 0.7;
        }

        .music-content {
            flex: 1;
        }

        .music-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-text {
            color: var(--text);
            margin: 0;
        }

        .modal-comments-section {
            margin: 30px 0;
        }

        .modal-comments-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px 0;
        }

        .modal-comment-item {
            padding: 12px;
            margin-bottom: 10px;
            background: var(--card);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
        }

        .modal-comment-item b {
            color: var(--accent);
            font-weight: 700;
        }

        .modal-comment-input-row {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .modal-comment-input {
            flex: 1;
            border: 2px solid var(--light-accent);
            padding: 12px 16px;
            border-radius: 14px;
            outline: none;
            font-size: 1rem;
        }

        .modal-comment-input:focus {
            border-color: var(--accent);
        }

        .modal-btn-send {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .modal-btn-send:hover {
            background: #3a7bc8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .modal-other-candidates {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid var(--light-accent);
        }

        .modal-other-candidates h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 20px 0;
        }

        .modal-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .btn-back {
            position: sticky;
            top: 10px;
            display: inline-block;
            margin-bottom: 12px;
            padding: 12px 18px;
            background: linear-gradient(90deg, var(--accent), #6aa5f3);
            color: white;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(74, 144, 226, 0.35);
            z-index: 2;
        }

        .btn-close-modal {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--accent);
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
            transition: 0.2s;
        }

        .btn-close-modal:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        .comment-input-row {
            display: flex;
            gap: 5px;
        }

        .comment-input {
            flex: 1;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 12px;
            outline: none;
        }

        .btn-send {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 12px;
            cursor: pointer;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            background: #2d3748;
            color: white;
            padding: 12px 25px;
            border-radius: 40px;
            display: none;
            z-index: 9999;
        }

        .btn-submit {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px; 
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
            color: white;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .btn-submit {
                display: block;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
            }
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-size: 1.2rem;
            color: var(--text);
        }

        .beta-banner {
            width: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .beta-banner a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="loading-screen">Загрузка анкет, подождите немного...</div>

<div class="beta-banner">
    ⚠️ Сайт в режиме BETA. Заметили баг? Пишите в <a href="https://t.me/zar_lookmax_bot" target="_blank">бота</a>!
</div>

<header>
    <h1>Lookmax Community</h1>
    <div style="margin-top:8px;font-size:1.05rem;color:var(--gray);">Топ луксмаксеров зареченской школы</div>
    <div style="margin-top:6px;font-size:0.95rem;color:var(--text);background:var(--light-accent);padding:10px 14px;border-radius:14px;display:inline-block;">Участник с самым высоким рейтингом выиграет 200 рублей в конце февраля</div>
    <a href="https://t.me/zar_lookmax_bot" target="_blank" class="btn-submit">Подать свою заявку за 30 секунд</a>
    <div class="profile-area">
        <div id="g_id_onload"
             data-client_id="422243119545-qmkulqdrldj9m1fiijqafq2jr00r1o62.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div id="auth-btn" class="g_id_signin" data-type="standard" data-shape="pill"></div>
        <div id="user-info" style="display:none">
            Привет, <span id="user-name" onclick="changeNick()">Загрузка...</span>
        </div>
    </div>
</header>

<div class="hall" id="hall-of-fame" style="display:none">
    <h2>Зал Славы</h2>
    <ul class="hall-list" id="hall-list"></ul>
</div>

<div class="container" id="cards-container"></div>
<div class="profile-view" id="profile-view"></div>
<div id="toast"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVcgRHnR4BmAbH5y2_0ZYLqjXoH4VwWL1AQROJJCMSCCHvkL18cDpMtB8g8YiweAiktw/exec";
    
    let candidates = [];
    let votes = [];
    let comments = [];

    let currentUser = null;
    let userEmail = ""; // Новая переменная для почты
    let currentNick = localStorage.getItem('customNick') || "";
    const commentCooldownMs = 5000;
    let lastCommentTime = 0;

    // Функция для преобразования имени файла в GitHub ссылку
    function getGitHubUrl(filename) {
        if (!filename || !filename.trim()) return '';
        const trimmed = filename.trim();
        // Если уже полная ссылка (http/https), возвращаем как есть
        if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
            return trimmed;
        }
        // Если это имя файла, превращаем в GitHub ссылку
        // Замените ТВОЙ_НИК и РЕПОЗИТОРИЙ на реальные значения
        return `https://raw.githubusercontent.com/ТВОЙ_НИК/РЕПОЗИТОРИЙ/main/files/${trimmed}`;
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = payload.sub;
        userEmail = payload.email; // Запоминаем почту из Google
        if (!currentNick) currentNick = payload.name;
        document.getElementById('auth-btn').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-name').innerText = currentNick;
        syncUserNickname();
        showToast("Успешный вход!");
    }

    function changeNick() {
        const n = prompt("Введи свой новый ник:", currentNick);
        if (n) {
            currentNick = n;
            localStorage.setItem('customNick', n);
            document.getElementById('user-name').innerText = n;
            syncUserNickname();
        }
    }

    function syncUserNickname() {
        if (!userEmail || !currentNick) return;
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                type: 'user',
                userEmail: userEmail,
                nickname: currentNick
            })
        });
    }

    function getStats(targetId) {
        const vs = votes.filter(v => v[0] === targetId);
        const count = vs.length;
        const avg = count > 0 ? (vs.reduce((a, b) => a + Number(b[1]), 0) / count).toFixed(1) : "0.0";
        return { avg, count };
    }

    function renderCards() {
        const container = document.getElementById('cards-container');
        container.innerHTML = candidates.map(c => {
            const { avg, count } = getStats(c.id);
            // Обрабатываем фото: если несколько через запятую, берем первое
            const photoValue = (c.photo || "").split(",").map(p => p.trim()).filter(Boolean)[0] || c.photo || '';
            const photoUrl = getGitHubUrl(photoValue);
            return `
            <div class="card" onclick="openProfile('${c.id}')">
                <img src="${photoUrl}" class="photo">
                <div class="name-row">
                    <div class="name">${c.name}</div>
                    <div class="rating-badge" id="val-${c.id}">${avg}</div>
                </div>
                <div style="font-size: 0.8rem; color: var(--gray); margin-bottom: 10px;" id="label-${c.id}">Голосов: ${count}</div>
                <div class="progress-bg">
                    <div class="progress-fill" id="bar-${c.id}" style="width:${(avg / 7) * 100}%"></div>
                </div>
                <div class="vote-grid" onclick="event.stopPropagation()">
                    <button class="btn-vote" onclick="vote('${c.id}', 1)">Sub3</button>
                    <button class="btn-vote" onclick="vote('${c.id}', 3)">LTN</button>
                    <button class="btn-vote" onclick="vote('${c.id}', 4)">MTN</button>
                    <button class="btn-vote" onclick="vote('${c.id}', 5)">HTN</button>
                    <button class="btn-vote" onclick="vote('${c.id}', 6)">CHAD</button>
                    <button class="btn-vote" onclick="vote('${c.id}', 7)">ADAM</button>
                </div>
                <div class="comment-section">
                    <div class="comment-list" id="comments-${c.id}"></div>
                    <div class="comment-input-row">
                        <input type="text" class="comment-input" id="input-${c.id}" placeholder="Твое мнение...">
                        <button class="btn-send" onclick="sendComment('${c.id}')">➤</button>
                    </div>
                </div>
            </div>
        `;
        }).join('');

        // Рендерим комментарии по кандидатам
        candidates.forEach(c => {
            const cs = comments.filter(com => com[0] === c.id);
            const clist = document.getElementById(`comments-${c.id}`);
            if (clist) {
                clist.innerHTML = cs.map(com => `
                    <div class="comment-item"><b>${com[1]}:</b> ${com[2]}</div>
                `).join('');
            }
        });
    }

    function renderHallOfFame() {
        const hall = document.getElementById('hall-of-fame');
        const list = document.getElementById('hall-list');
        const rated = candidates.map(c => {
            const { avg, count } = getStats(c.id);
            return { ...c, avg: Number(avg), count };
        }).filter(c => c.count > 0);
        rated.sort((a, b) => b.avg - a.avg);
        const top = rated.slice(0, 10);
        if (top.length === 0) {
            hall.style.display = "none";
            return;
        }
        hall.style.display = "block";
        list.innerHTML = top.map((c, idx) => {
            let medal = "";
            if (idx === 0) medal = "🥇 Золото";
            else if (idx === 1) medal = "🥈 Серебро";
            else if (idx === 2) medal = "🥉 Бронза";
            return `<li class="hall-item">
                <span>${idx + 1}. ${c.name} ${medal ? `<span class=\"medal\">${medal}</span>` : ""}</span>
                <span>${c.avg.toFixed(1)} • Голосов: ${c.count}</span>
            </li>`;
        }).join('');
    }

    function renderProfile(id) {
        const profile = document.getElementById('profile-view');
        const wrapList = document.getElementById('cards-container');
        const hall = document.getElementById('hall-of-fame');

        const cand = candidates.find(c => c.id === id);
        if (!cand) return;

        const { avg, count } = getStats(cand.id);
        const photos = (cand.photo || "").split(",").map(p => p.trim()).filter(Boolean);
        const mainPhotoRaw = photos[0] || cand.photo || '';
        const mainPhoto = getGitHubUrl(mainPhotoRaw);
        const modalComments = comments.filter(com => com[0] === cand.id);
        const otherCandidates = candidates.filter(c => c.id !== cand.id);

        wrapList.style.display = "none";
        hall.style.display = "none";
        profile.style.display = "block";
        window.scrollTo(0, 0);

        // Обрабатываем музыку: если это имя файла, превращаем в ссылку
        const musicValue = cand.music || '';
        const musicUrl = getGitHubUrl(musicValue);
        const musicDisplay = musicUrl && musicUrl !== musicValue ? 
            `<a href="${musicUrl}" target="_blank" style="color: var(--accent); text-decoration: none;">${musicValue}</a>` : 
            musicValue;
        const musicBlock = musicValue && musicValue.trim() ? `
            <div class="music-section">
                <div class="music-icon-wrapper">
                    <span class="music-icon">🎵</span>
                </div>
                <div class="music-content">
                    <div class="music-title">Любимый трек</div>
                    <div class="music-text">${musicDisplay}</div>
                </div>
            </div>
        ` : '';

        const descriptionBlock = cand.description && cand.description.trim() ? `
            <div class="modal-section">
                <div class="modal-section-title">О себе</div>
                <div class="modal-section-content">${cand.description}</div>
            </div>
        ` : '';

        const tgLink = cand.tg ? `<div style="margin:10px 0;"><a href="${cand.tg}" target="_blank" style="color: var(--accent); text-decoration: none; font-weight: 600;">💬 Написать в Telegram</a></div>` : "";

        profile.innerHTML = `
            <button class="btn-close-modal" onclick="goBack()" title="Закрыть">×</button>
            <div class="modal-header">
                <img src="${mainPhoto}" alt="${cand.name}" class="modal-main-photo">
                <h1 class="modal-name">${cand.name}</h1>
                <div style="font-size: 1.1rem; color: var(--gray); margin: 10px 0;">
                    Средний балл: <strong style="color: var(--accent);">${avg}</strong> • Голосов: <strong style="color: var(--accent);">${count}</strong>
                </div>
                ${tgLink}
            </div>
            ${descriptionBlock}
            ${musicBlock}
            <div class="modal-comments-section">
                <div class="modal-section-title" style="margin-bottom: 15px;">Комментарии</div>
                <div class="modal-comments-list" id="modal-comments-${cand.id}">
                    ${modalComments.length > 0 ? modalComments.map(com => `
                        <div class="modal-comment-item">
                            <b>${com[1]}:</b> ${com[2]}
                        </div>
                    `).join('') : '<div style="color: var(--gray); padding: 20px; text-align: center;">Пока нет комментариев</div>'}
                </div>
                <div class="modal-comment-input-row">
                    <input type="text" class="modal-comment-input" id="modal-input-${cand.id}" placeholder="Напиши комментарий..." onkeypress="if(event.key==='Enter') sendModalComment('${cand.id}')">
                    <button class="modal-btn-send" onclick="sendModalComment('${cand.id}')">Отправить</button>
                </div>
            </div>
            <div class="modal-other-candidates">
                <h3>Другие участники сообщества</h3>
                <div class="modal-cards-grid" id="modal-other-cards">
                    ${otherCandidates.map(c => {
                        const { avg: oAvg, count: oCount } = getStats(c.id);
                        const oPhotoRaw = (c.photo || "").split(",").map(p => p.trim()).filter(Boolean)[0] || c.photo || '';
                        const oPhoto = getGitHubUrl(oPhotoRaw);
                        return `
                            <div class="card" onclick="openProfile('${c.id}')" style="cursor: pointer;">
                                <img src="${oPhoto}" class="photo">
                                <div class="name-row">
                                    <div class="name">${c.name}</div>
                                    <div class="rating-badge">${oAvg}</div>
                                </div>
                                <div style="font-size: 0.8rem; color: var(--gray); margin-bottom: 10px;">Голосов: ${oCount}</div>
                                <div class="progress-bg">
                                    <div class="progress-fill" style="width:${(oAvg / 7) * 100}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }

    function goBack() {
        history.pushState("", document.title, window.location.pathname + window.location.search);
        document.getElementById('profile-view').style.display = "none";
        document.getElementById('cards-container').style.display = "grid";
        renderHallOfFame();
    }

    function openProfile(id) {
        location.hash = id;
    }

    function handleHashChange() {
        const hash = location.hash.replace("#", "");
        if (hash) {
            renderProfile(hash);
        } else {
            document.getElementById('profile-view').style.display = "none";
            document.getElementById('cards-container').style.display = "grid";
            renderHallOfFame();
        }
    }

    async function vote(tid, r) {
        if (!currentUser) return showToast("Нужно войти!");
        
        // Блокируем кнопки в этой карточке, чтобы не спамили
        const card = document.querySelector(`[onclick="vote('${tid}', ${r})"]`).parentElement;
        const buttons = card.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.disabled = true;
            btn.style.opacity = "0.5";
            btn.style.cursor = "not-allowed";
        });

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ 
                    type: 'vote', 
                    userId: currentUser, 
                    userEmail: userEmail, 
                    targetId: tid, 
                    rating: r 
                })
            });
            
            showToast("Голос учтен!");
            
            // Через 2 секунды возвращаем кнопкам рабочий вид
            setTimeout(() => {
                buttons.forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    btn.style.cursor = "pointer";
                });
            }, 2000);

        } catch (e) {
            showToast("Ошибка связи");
        }
    }

    async function sendComment(tid) {
        if (!currentUser) return showToast("Войди, чтобы писать");
        const now = Date.now();
        if (now - lastCommentTime < commentCooldownMs) {
            const waitMs = Math.ceil((commentCooldownMs - (now - lastCommentTime)) / 1000);
            return showToast(`Подожди ${waitMs} сек перед новым комментом`);
        }
        const inp = document.getElementById(`input-${tid}`);
        const val = inp.value.trim();
        if (!val) return;

        lastCommentTime = now;
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ 
                type: 'comment', 
                targetId: tid, 
                userName: currentNick, 
                userEmail: userEmail,
                text: val 
            })
        });
        inp.value = "";
        showToast("Отправлено");
    }

    async function sendModalComment(tid) {
        if (!currentUser) return showToast("Войди, чтобы писать");
        const now = Date.now();
        if (now - lastCommentTime < commentCooldownMs) {
            const waitMs = Math.ceil((commentCooldownMs - (now - lastCommentTime)) / 1000);
            return showToast(`Подожди ${waitMs} сек перед новым комментом`);
        }
        const inp = document.getElementById(`modal-input-${tid}`);
        if (!inp) return;
        const val = inp.value.trim();
        if (!val) return;

        lastCommentTime = now;
        
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ 
                    type: 'comment', 
                    targetId: tid, 
                    userName: currentNick, 
                    userEmail: userEmail,
                    text: val 
                })
            });
            
            inp.value = "";
            showToast("Комментарий отправлен!");
            
            // Мгновенно добавляем комментарий в список без перезагрузки
            const commentsList = document.getElementById(`modal-comments-${tid}`);
            if (commentsList) {
                const emptyMsg = commentsList.querySelector('div[style*="color: var(--gray)"]');
                if (emptyMsg) emptyMsg.remove();
                
                const newComment = document.createElement('div');
                newComment.className = 'modal-comment-item';
                newComment.innerHTML = `<b>${currentNick}:</b> ${val}`;
                commentsList.appendChild(newComment);
                commentsList.scrollTop = commentsList.scrollHeight;
            }
            
            // Обновляем данные через небольшую задержку для синхронизации
            setTimeout(() => sync(), 1000);
        } catch (e) {
            showToast("Ошибка отправки");
        }
    }

    async function sync() {
        try {
            const r = await fetch(SCRIPT_URL);
            const d = await r.json();
            candidates = d.candidates || [];
            votes = d.votes || [];
            comments = d.comments || [];
            renderCards();
            renderHallOfFame();
            handleHashChange();
            // Скрываем экран загрузки только в самом конце, когда все отрисовано
            document.getElementById('loading-screen').style.display = 'none';
        } catch(e) {
            // В случае ошибки тоже скрываем экран загрузки
            document.getElementById('loading-screen').style.display = 'none';
        }
    }

    // Админская функция накрутки рейтинга
    window.adminBoost = async function(id, count) {
        if (!id || !count || count <= 0) {
            console.error('adminBoost: Invalid parameters. Usage: adminBoost(candidateId, voteCount)');
            return;
        }
        
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    type: 'admin_boost',
                    auth: 'ZarechyeMax2024',
                    targetId: id,
                    count: count
                })
            });
            
            console.log(`✅ Admin boost успешно применен: ${count} голосов для кандидата ${id}`);
            
            // Обновляем данные и перерисовываем профиль, если он открыт
            setTimeout(async () => {
                await sync();
                const currentHash = location.hash.replace("#", "");
                if (currentHash === id) {
                    renderProfile(id);
                }
            }, 1500);
            
        } catch (e) {
            console.error('❌ Ошибка при применении admin boost:', e);
        }
    };

    window.addEventListener('hashchange', handleHashChange);
    sync();
    setInterval(sync, 4000);
</script>

</body>
</html>
